name: Build and Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Build macOS platforms
        run: |
          npm run clean
          npm run build:osx
          npm run build:osxm1
      - name: Upload macOS binaries
        uses: softprops/action-gh-release@v2
        with:
          files: build/releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg
          npm install
      - name: Build Linux platforms
        run: |
          npm run clean
          npm run build:linux
          npm run build:linux32
          npm run build:linuxarmv7l
      - name: Upload Linux binaries
        uses: softprops/action-gh-release@v2
        with:
          files: build/releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-win:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Build Windows platform
        run: |
          npm run clean
          npm run build:win
      - name: Upload Windows binaries
        uses: softprops/action-gh-release@v2
        with:
          files: build/releases/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
